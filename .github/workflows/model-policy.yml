name: model-policy
# Kanboard #1752: repo-wide model-policy guard (minimum Qwen 3.8), enforced.
# Public repo: GitHub does not let a public repository call the private
# claude-conventions reusable workflow/action, so the scanner is vendored
# verbatim from claude-conventions@171d9b5 (workflows/model-policy/model_policy_scan.py)
# into .github/model-policy/. Refresh it from claude-conventions when the policy changes.
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}
jobs:
  model-policy:
    # Documented ubuntu-latest exception (CLAUDE.md §6): the org runner group does not take jobs from
    # public repositories (this job sat queued on albright-runners), and this step needs no secrets or cluster access.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Model-policy scan (repo mode, enforced)
        run: python .github/model-policy/model_policy_scan.py repo . --enforce
